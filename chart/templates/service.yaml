apiVersion: v1
kind: Service
metadata:
  name: {{ include "community-plugins-catalog.fullname" . }}
  namespace: {{ include "community-plugins-catalog.namespace" . }}
  labels:
    {{- include "community-plugins-catalog.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "community-plugins-catalog.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
